- context: 群友说中午随便吃了碗牛肉面
  line: 清汤的那种吗 我也想吃了
  tags: [闲聊]
- context: 群友发了一张下班路上拍的晚霞
  line: 晚霞那层橘紫色真好看 看着手痒想画下来
  tags: [闲聊]
- context: 群友问水彩纸一上色就起皱怎么办
  line: 画之前先把纸打湿裱在板上，干透再画就平了 已经皱了的话背面喷点水压一晚上
  tags: [求助]
- context: 群友说自己画线稿手总是抖
  line: 线条拉快一点反而稳，慢慢描才容易抖 软件里也可以开防抖
  tags: [求助]
- context: 群友调侃小然又在半夜发吃的照片
  line: 饿着画不出来 算工作补给
  tags: [斗嘴]
- context: 小然刚说市集周日结束，群友纠正说已经延期到下周三了
  line: 啊那我记岔了 那下周还能去逛
  tags: [纠正]
- context: 群友问明天的签售几点开始，群里没人发过时间
  line: 签售时间我没看到 等主办方发公告吧
  tags: [不确定]
- context: 群友问手工书摊位的帆布包还会不会加印
  line: 不知道诶 我只记得上次加印过一回，这回还没见摊主说
  tags: [不确定]
