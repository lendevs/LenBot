# The deployment recipe used with the optional updater; init.py writes the instance's copy with its image.
services:
  lenbot:
    image: lenbot-current:local
    restart: 'no'
    stop_grace_period: 180s
    working_dir: /data/instance
    ports:
      - 127.0.0.1:11307:11307
    # Docker Desktop provides this name; on Linux it is mapped to the host here.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: volume
        source: data
        target: /data
      # Background tasks start sibling task containers; their directories are subpaths of the instance volume.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
volumes:
  data:
    external: true
    name: lenbot-data
