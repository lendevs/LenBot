# Copy this recipe for the instance; set its image and release-specific Python volume.
services:
  lenbot:
    image: lenbot-current:local
    restart: 'no'
    stop_grace_period: 180s
    working_dir: /srv/lenbot
    environment:
      HOME: /srv/lenbot
    ports:
      - 127.0.0.1:11307:11307
    # Docker Desktop provides this name; on Linux it is mapped to the host here.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: volume
        source: instance
        target: /srv/lenbot
      - type: volume
        source: python
        target: /opt/lenbot/.venv
      # Background tasks start sibling task containers; their directories are subpaths of the instance volume.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
volumes:
  instance:
    external: true
    name: lenbot-data
  python:
    external: true
    name: lenbot-python-r1
