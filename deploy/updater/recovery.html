<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LenBot 更新与恢复</title>
<style>body{font:16px/1.65 system-ui;margin:48px auto;padding:0 24px;max-width:840px;background:#f6f7f8;color:#242b34}h1{font-size:28px}button,select{font:inherit;padding:9px 16px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;background:white;padding:20px;border:1px solid #dce0e5}label{display:block}#error{color:#b42318}#notes{background:white;padding:4px 20px;border:1px solid #dce0e5;overflow-x:auto}#notes h2{font-size:22px}#notes h3{font-size:18px}#notes table{border-collapse:collapse;width:100%}#notes th,#notes td{border-bottom:1px solid #dce0e5;padding:6px 16px 6px 0;text-align:left;vertical-align:top}code{font-size:.9em;background:#eef0f2;padding:0 4px;border-radius:3px}</style>
<h1>LenBot 更新与恢复</h1><p>更新期间此页面保持可用，聊天、提醒和后台任务暂停。备份完成后的更新失败会自动恢复更新前的程序和数据快照并启动旧版本；自动回滚会丢弃更新开始后写入的数据，包括新消息、记忆、设置修改和任务记录。</p>
<p id="current"></p><p id="error" role="alert"></p>
<button id="check">检查发行版本</button><label><input id="prerelease" type="checkbox">显示预发布版本</label>
<select id="versions" aria-label="目标版本"></select><button id="prepare">准备更新</button>
<p id="worker"></p><div id="notes"><p>请先检查版本，准备完成后确认停机升级。</p></div>
<button id="apply" hidden>确认停机、备份并升级</button><button id="restore" hidden>恢复升级前程序和数据快照</button><button id="start" hidden>启动程序</button>
<pre id="status"></pre><p>恢复后实例数据回到页面显示的快照时间，此后的修改将被覆盖。</p>
<details><summary>原始更新日志</summary><button id="read-log">读取日志</button><pre id="log"></pre></details>
<script>
const token = new URLSearchParams(location.hash.slice(1)).get('session');
history.replaceState(null, '', location.pathname);
if(token) sessionStorage.setItem('lenbot-update-session',token);
const headers={'Authorization':'Bearer '+sessionStorage.getItem('lenbot-update-session'),'Content-Type':'application/json'};
let releases=[];
const $=id=>document.getElementById(id);
async function request(path,body){const r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.detail);return v}
async function action(path,body={}){try{$('error').textContent='';await request(path,body);await refresh()}catch(e){$('error').textContent=e.message}}
function options(){const previous=$('versions').value;$('versions').replaceChildren(...releases.filter(r=>r.installable&&($('prerelease').checked||!r.prerelease)).map(r=>new Option(r.tag,r.tag)));if([...$('versions').options].some(o=>o.value===previous))$('versions').value=previous;notes()}
// Release notes in a Markdown subset (headings, lists, tables, code, bold, http(s) links), built as DOM nodes.
function el(tag,...children){const e=document.createElement(tag);e.append(...children);return e}
function inline(text){return text.split(/(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/).filter(Boolean).map(part=>{const link=/^\[([^\]]+)\]\((\S+)\)$/.exec(part);if(link){const a=el('a',link[1]);a.href=link[2];a.target='_blank';a.rel='noopener noreferrer';return a}if(part.length>2&&part[0]==='`'&&part.endsWith('`'))return el('code',part.slice(1,-1));if(part.length>4&&part.startsWith('**')&&part.endsWith('**'))return el('strong',...inline(part.slice(2,-2)));return part})}
function markdown(text){const nodes=[],lines=text.replace(/\r\n?/g,'\n').replace(/^#\s[^\n]*\n+/,'').split('\n'),row=/^\s*\|.*\|\s*$/,cells=(line,tag)=>el('tr',...line.trim().replace(/^\||\|$/g,'').split('|').map(c=>el(tag,...inline(c.trim()))));let block=null;
for(let i=0;i<lines.length;i++){const line=lines[i];let m;
if(line.trimStart().startsWith('```')){const body=[];for(i++;i<lines.length&&!lines[i].trimStart().startsWith('```');i++)body.push(lines[i]);nodes.push(el('pre',body.join('\n')));block=null}
else if(!line.trim())block=null;
else if(row.test(line)&&/^\s*\|?(\s*:?-{3,}:?\s*\|)+(\s*:?-{3,}:?\s*)?\|?\s*$/.test(lines[i+1]||'')){const body=[];for(i+=2;i<lines.length&&row.test(lines[i]);i++)body.push(cells(lines[i],'td'));i--;nodes.push(el('table',el('thead',cells(line,'th')),el('tbody',...body)));block=null}
else if((m=/^(#{1,6})\s+(.*)$/.exec(line))){nodes.push(el('h'+Math.min(6,m[1].length+1),...inline(m[2])));block=null}
else if((m=/^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(line))){if(block?.tagName!=='UL'&&block?.tagName!=='OL')nodes.push(block=el(/\d/.test(m[1])?'ol':'ul'));block.append(el('li',...inline(m[2])))}
else if(block?.tagName==='P')block.append(el('br'),...inline(line.trim()));
else if(block)block.lastChild.append(' ',...inline(line.trim()));
else nodes.push(block=el('p',...inline(line.trim())))}
return nodes}
function notes(){const text=releases.find(r=>r.tag===$('versions').value)?.notes;$('notes').replaceChildren(...(text?markdown(text):[el('p','没有可安装的发行版本。')]))}
async function refresh(){try{const s=await request('status');$('current').textContent=`当前版本 ${s.current_version} · ${s.mode}`;$('status').textContent=JSON.stringify(s,null,2);for(const name of ['apply','restore','start'])$(name).hidden=!s.actions.includes(name);$('prepare').disabled=!s.actions.includes('prepare');const w=s.status==='prepared'&&s.check?.worker_image;$('worker').textContent=!w?'':s.check.worker_follows_release?`任务镜像将换为 ${w}（已提前拉取）。`:`任务镜像 ${w} 是自定义镜像，本次更新保持原样；需要时自行重建并修改配置。`;if(s.error)$('error').textContent=s.error}catch(e){$('error').textContent=e.message}}
$('check').onclick=async()=>{try{releases=await request('releases');options()}catch(e){$('error').textContent=e.message}};
$('prerelease').onchange=options;$('versions').onchange=notes;
$('prepare').onclick=()=>{if($('restore').hidden||confirm('准备新版本后，将无法恢复本次更新前的程序和数据快照。快照保留在 backups/ 下。是否继续？'))action('prepare',{tag:$('versions').value})};
$('apply').onclick=()=>{if(confirm('将暂停聊天、提醒和后台任务，备份实例并升级。备份完成后的更新失败会自动恢复旧版本和数据快照，丢弃更新开始后写入的数据。是否继续？'))action('apply')};
$('restore').onclick=()=>{if(confirm('将恢复升级前程序和数据快照，覆盖快照之后的修改。是否继续？'))action('restore')};
$('start').onclick=()=>action('start');refresh();setInterval(refresh,2000);
$('read-log').onclick=async()=>{try{$('log').textContent=(await request('log')).text}catch(e){$('error').textContent=e.message}};
</script></html>
