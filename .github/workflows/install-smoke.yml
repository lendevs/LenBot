name: Install smoke

# Called after release-packages is uploaded in the same run. Installs what a user would download,
# walks first setup to a logged-in panel and stops it; simulated delivery, no OneBot or model.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # One runner per published package: Linux x64, Linux arm64 and Windows x64.
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.13'
      # The update smoke packages its baseline versions; Linux packages install Pi with npm.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      # Linux packages run tasks in the local sandbox; Ubuntu 24.04 keeps unprivileged user namespaces behind AppArmor
      # (the same setup as check.yml). The update smoke below also switches the sandbox on in its old version.
      - name: Install bubblewrap and allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unpack the deployment package, start it and walk first setup to the panel
        shell: bash
        run: uv run --no-project --python 3.13 python scripts/smoke_install.py package packages "$RUNNER_TEMP/smoke"
      # The unpacked package's own Python and task runtime run one task in the sandbox: Pi, the model bridge, a question,
      # a delivery, the network allowlist and the offline file workloads. Only the Pi and architecture lines are the record.
      - name: Run a task with the package's own Python and task runtime
        if: runner.os == 'Linux'
        run: |
          set -- "$RUNNER_TEMP/smoke/Len Bot's/releases"/*
          release="$1"
          "$release/python/bin/python3" scripts/smoke_worker.py --sandbox bwrap --task-runtime "$release/task-runtime" \
            --workloads --network-probe | tee "$RUNNER_TEMP/smoke-worker.json"
          "$release/python/bin/python3" - "$RUNNER_TEMP/smoke-worker.json" "$(uname -m)" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          print(f"In-package task smoke on {sys.argv[2]}: Pi {result['pi']}, host {result['host']}, "
                f"{'passed' if all(result['checks'].values()) else 'failed'} ({len(result['checks'])} checks)")
          PY
      - name: Upgrade and restore two real packaged versions
        shell: bash
        run: uv run --no-project --python 3.13 python scripts/smoke_update.py packages "$RUNNER_TEMP/update-smoke"

  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.13'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Build the host image from the same wheel
        run: |
          docker build --build-arg PACKAGE_SOURCE=wheel --build-context release=packages \
            -f deploy/current/Dockerfile -t lenbot-current:smoke .
      - name: Initialize a new data volume, start the documented docker run and log in to the panel
        run: python3 scripts/smoke_install.py docker packages "$RUNNER_TEMP/smoke" --image lenbot-current:smoke
      - name: Build the independent updater, the synthetic baseline and a release that fails during startup
        run: |
          docker build -f docker/updater/Dockerfile -t lenbot-updater:smoke .
          uv run --no-project --python 3.13 python scripts/smoke_update.py packages "$RUNNER_TEMP/baseline" --baseline-only
          docker build --build-arg PACKAGE_SOURCE=wheel --build-context "release=$RUNNER_TEMP/baseline/baseline-artifacts" \
            -f deploy/current/Dockerfile -t lenbot-current:baseline .
          uv run --no-project --python 3.13 python scripts/smoke_update.py packages "$RUNNER_TEMP/broken" --broken-only
          docker build --build-arg PACKAGE_SOURCE=wheel --build-context "release=$RUNNER_TEMP/broken/broken-artifacts" \
            -f deploy/current/Dockerfile -t lenbot-current:broken .
      - name: Replace the image and restore program, volume and instance data
        run: |
          python3 scripts/smoke_docker_update.py packages "$RUNNER_TEMP/docker-update" \
            --baseline-image lenbot-current:baseline --host-image lenbot-current:smoke --updater-image lenbot-updater:smoke \
            --broken-image lenbot-current:broken
