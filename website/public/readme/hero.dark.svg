<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="LenBot：自主决策的群聊 Agent"><title>LenBot：自主决策的群聊 Agent</title><defs><linearGradient id="he-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2530"/><stop offset="1" stop-color="#141317"/></linearGradient><linearGradient id="he-name" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#b4476a"/><stop offset=".55" stop-color="#e0789a"/><stop offset="1" stop-color="#f0a868"/></linearGradient><filter id="he-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter><pattern id="he-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ec8fae" opacity=".16"/></pattern><clipPath id="he-clip"><rect x="0" y="0" width="1280" height="440" rx="28"/></clipPath><filter id="he-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/></filter></defs><style>.he-spin{transform-box:fill-box;transform-origin:center;animation:he-spin 0.9s linear infinite}@keyframes he-spin{to{transform:rotate(360deg)}}.he-dot{animation:he-dot 1s ease-in-out infinite}@keyframes he-dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}.he-float{animation:he-float 6s ease-in-out infinite}@keyframes he-float{0%,100%{transform:none}50%{transform:translateY(-7px)}}.he-bob{animation:he-bob 3.6s ease-in-out infinite}@keyframes he-bob{0%,100%{transform:none}50%{transform:translateY(-2px)}}.he-antenna{transform-origin:47px 27px;animation:he-sway 3.6s ease-in-out infinite}@keyframes he-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}.he-eye{transform-box:fill-box;transform-origin:center;animation:he-blink 5s infinite}@keyframes he-blink{0%,90%,96%,100%{transform:none}93%{transform:scaleY(.12)}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', Helvetica, Arial, sans-serif}.he-mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.he-blob1{animation:he-drift1 14s ease-in-out infinite}.he-blob2{animation:he-drift2 17s ease-in-out infinite}@keyframes he-drift1{0%,100%{transform:none}50%{transform:translate(90px,40px)}}@keyframes he-drift2{0%,100%{transform:none}50%{transform:translate(-110px,-30px)}}@keyframes he-w0{0%,0.00%{opacity:0;transform:translateY(14px)}3.33%,21.67%{opacity:1;transform:none}25.00%,100%{opacity:0;transform:translateY(-14px)}}.he-w0{animation:he-w0 12s cubic-bezier(.22,1,.36,1) infinite}@keyframes he-w1{0%,25.00%{opacity:0;transform:translateY(14px)}28.33%,46.67%{opacity:1;transform:none}50.00%,100%{opacity:0;transform:translateY(-14px)}}.he-w1{animation:he-w1 12s cubic-bezier(.22,1,.36,1) infinite;opacity:0}@keyframes he-w2{0%,50.00%{opacity:0;transform:translateY(14px)}53.33%,71.67%{opacity:1;transform:none}75.00%,100%{opacity:0;transform:translateY(-14px)}}.he-w2{animation:he-w2 12s cubic-bezier(.22,1,.36,1) infinite;opacity:0}@keyframes he-w3{0%,75.00%{opacity:0;transform:translateY(14px)}78.33%,96.67%{opacity:1;transform:none}100.00%,100%{opacity:0;transform:translateY(-14px)}}.he-w3{animation:he-w3 12s cubic-bezier(.22,1,.36,1) infinite;opacity:0}</style><g clip-path="url(#he-clip)"><rect x="0.0" y="0.0" width="1280.0" height="440.0" rx="28" fill="url(#he-bg)"/><g filter="url(#he-blur)"><g class="he-blob1"><circle cx="980" cy="90" r="170" fill="#6d2f48" opacity=".9"/></g><g class="he-blob2"><circle cx="1180" cy="380" r="150" fill="#6b4224" opacity=".8"/></g><g class="he-blob1"><circle cx="160" cy="420" r="120" fill="#6d2f48" opacity=".5"/></g></g><rect x="0.0" y="0.0" width="1280.0" height="440.0" rx="0" fill="url(#he-dots)"/></g><rect x="0.5" y="0.5" width="1279.0" height="439.0" rx="28" fill="none" stroke="#2e2d33"/><svg x="86.0" y="104.0" width="210.9" height="232.0" viewBox="8 0 80 88"><g class="he-bob"><path class="he-antenna" d="M47 27C44 18 47 11 55 9C61 8 64 13 60 16C57 17.5 55.5 14.5 58.5 12.5" fill="none" stroke="#E2809F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 26C67 26 79 37 79 51S67 76 48 76C44.5 76 41 75.5 38 74.6L22 81L26 69C20 64.5 17 58 17 51C17 37 29 26 48 26Z" fill="#E2809F"/><rect class="he-eye" x="35" y="43" width="7" height="14" rx="3.5" fill="#2A2530"/><rect class="he-eye" x="54" y="43" width="7" height="14" rx="3.5" fill="#2A2530"/><path d="M42.5 62Q45.25 65 48 62Q50.75 65 53.5 62" fill="none" stroke="#2A2530" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg><text x="330.0" y="196.0" font-size="104" fill="url(#he-name)" font-weight="700">LenBot</text><text x="336.0" y="252.0" font-size="36" fill="#ecebef" font-weight="600">自主决策的群聊 Agent</text><rect x="336.0" y="288.8" width="127.5" height="42.0" rx="21" fill="#1c1b20" stroke="#e891ad" stroke-width="1.5"/><g class="he-w0"><text x="399.8" y="316.8" font-size="22" fill="#ec8fae" font-weight="700" text-anchor="middle">何时开口</text></g><g class="he-w1"><text x="399.8" y="316.8" font-size="22" fill="#ec8fae" font-weight="700" text-anchor="middle">回复谁</text></g><g class="he-w2"><text x="399.8" y="316.8" font-size="22" fill="#ec8fae" font-weight="700" text-anchor="middle">先查什么</text></g><g class="he-w3"><text x="399.8" y="316.8" font-size="22" fill="#ec8fae" font-weight="700" text-anchor="middle">何时跟进</text></g><text x="479.5" y="316.8" font-size="22" fill="#a19ea8" font-weight="500">由同一个聊天模型决定</text><g class="he-float"><circle cx="878.0" cy="128.0" r="18" fill="#26361d"/><text x="878.0" y="134.5" font-size="17" fill="#a8d68a" font-weight="600" text-anchor="middle">小</text><path d="M910.0 110.0H1107.0Q1120.0 110.0 1120.0 123.0V137.0Q1120.0 150.0 1107.0 150.0H919.0Q906.0 150.0 906.0 137.0V114.0Q906.0 110.0 910.0 110.0Z" fill="